services:
  influxdb:
    # Flux queries and the Python sink require InfluxDB 2, not InfluxDB 3.
    # Main previously used `latest`, which migrated existing volumes to 2.9;
    # keep that metadata compatible instead of silently downgrading to 2.7.
    image: influxdb:2.9.1
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: yliveticker
      DOCKER_INFLUXDB_INIT_BUCKET: ticker_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-my-super-secret-auth-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test:
        - CMD-SHELL
        - influx bucket list --host http://localhost:8086 --org yliveticker --token "$$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN" --name ticker_data > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-my-super-secret-auth-token}
      # Global live watchlist: crypto, FX, commodities and ten equity markets.
      TICKER_SYMBOLS: ${TICKER_SYMBOLS:-BTC-USD EURUSD=X GC=F AAPL SHOP.TO VALE3.SA SAP.DE HSBA.L NPN.JO RELIANCE.NS 0700.HK 7203.T BHP.AX}
      # Exercise the real package path by default; the synthetic test feed is opt-in.
      TICKER_SYNTHETIC: ${TICKER_SYNTHETIC:-0}
      TICKER_MAX_CONNECTIONS: ${TICKER_MAX_CONNECTIONS:-4}
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      # A running Python process alone does not prove that ticks reach storage.
      test: ["CMD", "python", "examples/tsdb_example.py", "--check"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:12.4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dashboard.json
      INFLUX_TOKEN: ${INFLUX_TOKEN:-my-super-secret-auth-token}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
