apiVersion: 1

datasources:
  - name: InfluxDB
    uid: yliveticker-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: yliveticker
      defaultBucket: ticker_data
    secureJsonData:
      token: $INFLUX_TOKEN
    isDefault: true
    editable: false
