# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install yliveticker from working directory
      run: |
        pip install -e ".[all]"
    - name: Test with pytest
      run: pytest tests --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}.xml
    - name: Check generated dashboard
      run: python -m yliveticker.dashboard --check --output docker/grafana/dashboards/dashboard.json
    - name: Upload pytest test results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: junit/test-results-${{ matrix.python-version }}.xml
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

  protobuf:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        protobuf: ['3.20.3', '4.25.8', '5.29.5', '6.33.5', '7.34.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[cli]' pytest 'protobuf==${{ matrix.protobuf }}'
      - run: python -m pytest tests/yliveticker_test.py tests/currency_test.py tests/pooling_test.py tests/pooling_transport_test.py

  sink-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: yliveticker-test
          POSTGRES_USER: yliveticker
          POSTGRES_DB: yliveticker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yliveticker"
          --health-interval 5s --health-timeout 5s --health-retries 10
      questdb:
        image: questdb/questdb:8.2.3
        ports: ['9000:9000', '9009:9009']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[questdb,timescaledb]' requests
      - run: python tests/verify_timescale_integration.py
        env:
          TIMESCALE_DSN: dbname=yliveticker user=yliveticker password=yliveticker-test host=localhost
      - run: python tests/verify_questdb_integration.py

  package-checks:
    name: Package checks
    if: ${{ always() }}
    needs: [build, protobuf, sink-integration]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every matrix job to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PROTOBUF_RESULT: ${{ needs.protobuf.result }}
          SINK_RESULT: ${{ needs.sink-integration.result }}
        run: test "$BUILD_RESULT" = success && test "$PROTOBUF_RESULT" = success && test "$SINK_RESULT" = success
